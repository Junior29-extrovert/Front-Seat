<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front Seat - Taxi Payment Tracker</title>

    <!-- Bootstrap 5 CSS -->

    <link

        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

        rel="stylesheet"

    >

    <!-- Our Custom CSS -->

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Header -->

    <header class="bg-dark text-white text-center py-4">

        <div class="container">

            <h1>🚕 Front Seat</h1>

            <p class="mb-0">Taxi Payment Tracker</p>

        </div>

    </header>

    <main class="container py-4">

        <!-- Route Selection -->

        <section class="card shadow-sm mb-4">

            <div class="card-body">

                <h2 class="h4">Choose Your Route</h2>

                <label for="routeSelect" class="form-label">

                    Select Route

                </label>

                <select id="routeSelect" class="form-select">

                    <option value="">Choose a route...</option>

                </select>

                <div class="alert alert-info mt-3 mb-0">

                    Fare per person:

                    <strong id="fareDisplay">R0</strong>

                </div>

            </div>

        </section>

        <!-- Payment Form -->

        <section class="card shadow-sm mb-4">

            <div class="card-body">

                <h2 class="h4">Record Payment</h2>

                <div id="paymentAlert"></div>

                <form id="paymentForm">

                    <!-- Row -->

                    <div class="mb-3">

                        <label for="rowSelect" class="form-label">

                            Row

                        </label>

                        <select id="rowSelect" class="form-select" required>

                            <option value="">Choose a row...</option>

                            <option value="Front">Front</option>

                            <option value="Row 1">Row 1</option>

                            <option value="Row 2">Row 2</option>

                            <option value="Row 3">Row 3</option>

                            <option value="Row 4">Row 4</option>

                        </select>

                    </div>

                    <!-- Number of People -->

                    <div class="mb-3">

                        <label for="peopleInput" class="form-label">

                            Number of People

                        </label>

                        <input

                            type="number"

                            id="peopleInput"

                            class="form-control"

                            min="1"

                            placeholder="e.g. 3"

                            required

                        >

                    </div>

                    <!-- Amount Given -->

                    <div class="mb-3">

                        <label for="amountInput" class="form-label">

                            Amount Handed Over (R)

                        </label>

                        <input

                            type="number"

                            id="amountInput"

                            class="form-control"

                            min="1"

                            step="1"

                            placeholder="e.g. 100"

                            required

                        >

                    </div>

                    <button type="submit" class="btn btn-primary w-100">

                        Record Payment

                    </button>

                </form>

            </div>

        </section>

        <!-- Change Owed -->

        <section class="card shadow-sm mb-4">

            <div class="card-body">

                <h2 class="h4">Change Owed</h2>

                <div id="changeList">

                    <p class="text-muted mb-0">

                        No change owed yet.

                    </p>

                </div>

            </div>

        </section>

        <!-- Trip Summary -->

        <section class="card shadow-sm mb-4">

            <div class="card-body">

                <h2 class="h4">Trip Summary</h2>

                <div class="row text-center">

                    <div class="col-6 col-md-3 mb-3">

                        <div class="summary-box">

                            <h3 id="seatsPaid">0 / 15</h3>

                            <p>Seats Paid</p>

                        </div>

                    </div>

                    <div class="col-6 col-md-3 mb-3">

                        <div class="summary-box">

                            <h3 id="seatsLeft">15</h3>

                            <p>Seats Left</p>

                        </div>

                    </div>

                    <div class="col-6 col-md-3 mb-3">

                        <div class="summary-box">

                            <h3 id="totalFares">R0</h3>

                            <p>Total Fares</p>

                        </div>

                    </div>

                    <div class="col-6 col-md-3 mb-3">

                        <div class="summary-box">

                            <h3 id="totalChange">R0</h3>

                            <p>Change Owed</p>

                        </div>

                    </div>

                </div>

                <div id="fullMessage"></div>

            </div>

        </section>

        <!-- Payments List -->

        <section class="card shadow-sm">

            <div class="card-body">

                <h2 class="h4">Payment History</h2>

                <div id="paymentList">

                    <p class="text-muted mb-0">

                       No payments recorded yet.

                </p>

           </div>

       </div>

<script src="js/app.js"></script>
</body>
</html>
